<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CUBO GYM</title>
    <link rel="stylesheet" href="../CSS/index.css">
    <link href="https://fonts.googleapis.com/css2?family=League+Gothic&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">
                <img src="../images/logo.png" alt="CUBO GYM logo">
            </a>

            <ul class="nav-links">
                <li><a href="membership.html">Membership</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="locations.html">Locations</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="hero-title">
                <h1>CUBO</h1>
                <h2>GYM</h2>
            </div>

            <div class="hero-buttons">
                <a href="login.html">LOG IN</a>
                <div class = "hero-divider"></div>
                <a href="register.html">SIGN UP</a>
            </div>
        </section>

        <section class="stats">
            <div class="stat-card">
                <img src="../images/membros.png" alt="logo">
                <p class="stat-number">+10000</p>
                <p class="stat-text">members</p>
            </div>

            <div class="stat-card">
                <img src="../images/membros.png" alt="logo">
                <p class="stat-number">4.7</p>
                <p class="stat-text">average rating</p>
            </div>

            <div class="stat-card"> 
                <img src="../images/membros.png" alt="logo">
                <p class="stat-number">+200</p>
                <p class="stat-text">weekly classes</p>
            </div>

            <div class="stat-card">
                <img src="../images/membros.png" alt="logo">
                <p class="stat-number">+25 certified</p>
                <p class="stat-text">personal trainers</p>
            </div>
        </section>

        <section class="about">
            <div class="about-text">
                <h2><span>We are </span><br>CUBO GYM</h2>

                <p>All levels. All goals. One gym.</p>
                <p>Your journey starts here.</p>
                <p>No limits. No judgments.</p>

                <a href="about.html" class="about-button">Our Story</a>
            </div>

            <div class="about-image">
                <img src="../images/gym.png" alt="Interior of CUBO GYM">
            </div>
        </section>
    </main>

</body>
</html>
